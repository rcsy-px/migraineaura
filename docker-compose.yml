services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migraineaura
      POSTGRES_USER: migraine
      POSTGRES_PASSWORD: migraine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migraine -d migraineaura"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
