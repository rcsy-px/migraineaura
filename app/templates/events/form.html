{% extends "base.html" %}
{% block title %}Esemény szerkesztése{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <p class="eyebrow">részletes naplózás</p>
    <h1>{% if event.id %}Esemény szerkesztése{% else %}Új esemény{% endif %}</h1>
  </div>
</div>
<form class="panel form-panel" method="post">
  {% include "events/_fields.html" %}
  <div class="sticky-actions">
    <button class="btn btn-primary btn-lg" type="submit">Mentés</button>
    <a class="btn btn-ghost btn-lg" href="{{ url_for('events.list_events') }}">Mégse</a>
  </div>
</form>
{% endblock %}
