{% extends "base.html" %}
{% block title %}Regisztráció{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div>
    <p class="eyebrow">helyi fiók</p>
    <h1>Kezdjünk egy tiszta naplóval.</h1>
    <p class="muted">Egy felhasználónév és jelszó elég a személyes használathoz.</p>
  </div>
  <form class="panel auth-panel" method="post">
    <label class="form-label">Felhasználónév</label>
    <input class="form-control form-control-lg" name="username" autocomplete="username" required autofocus>
    <label class="form-label mt-3">Jelszó</label>
    <input class="form-control form-control-lg" type="password" name="password" autocomplete="new-password" minlength="8" required>
    <button class="btn btn-primary btn-lg w-100 mt-4" type="submit">Fiók létrehozása</button>
    <a class="small-link" href="{{ url_for('auth.login') }}">Már van fiókom</a>
  </form>
</section>
{% endblock %}
